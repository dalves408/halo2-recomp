; Halo 2 keyboard and mouse layout, after Halo 2 for Windows (Vista). Each line
; binds up to four keys or mouse buttons to one Xbox controller input, comma
; separated; "none" unbinds it.
; Copy this file to SaveData\keymap.ini to make your own changes (that copy
; wins and survives updates). The F1 menu and Config.exe edit the mouse lines.
;
; Mouse buttons and the wheel (mouse1..mouse5, mwheelup, mwheeldown) count
; only while Mouse aim is on in the F1 menu; the mouse then turns the player.
; The mouse turns off in the Xbox Live menus and matches (controller only there).
;
; Fixed keys: Esc asks to quit the game, F1 opens the settings and controls.
; In menus left click is Start and right click is B.
;
; Key names: letters and digits, space, tab, enter, backspace, capslock, shift,
; lshift, rshift, ctrl, lctrl, rctrl, alt, up, down, left, right, insert,
; delete, home, end, pageup, pagedown, f2-f12, numpad0-numpad9, semicolon,
; comma, period, slash, minus, equals, grave, quote, leftbracket, rightbracket,
; backslash, mouse1-mouse5, mwheelup, mwheeldown.

[keys]
; movement: W S A D. Look without a mouse: I K J L
left_stick_up    = W
left_stick_down  = S
left_stick_left  = A
left_stick_right = D
right_stick_up    = I
right_stick_down  = K
right_stick_left  = J
right_stick_right = L

; A jump
a = space
; B melee (and back in the menus)
b = F, backspace
; X reload, and hold to pick up or exchange a weapon or use a device
x = E
; Y switch weapon, and hold to pick up a second weapon (dual wield)
y = Q, mwheelup, mwheeldown

; right trigger: fire (the right weapon when dual wielding)
right_trigger = mouse1
; left trigger: throw grenade (the left weapon when dual wielding)
left_trigger  = mouse2, tab

; left stick click crouch, right stick click zoom
left_thumb  = lshift
right_thumb = Z, mouse3

; White flashlight, Black swap grenades
white = X
black = capslock, mouse4

; Back multiplayer score, Start pause (and confirm in the menus)
back  = C
start = enter
dpad_up    = up
dpad_down  = down
dpad_left  = left
dpad_right = right
