; Halo 2 keyboard and mouse layout. Each line binds up to four keys or mouse
; buttons to one Xbox controller input, comma separated; "none" unbinds it.
; Copy this file to SaveData\keymap.ini to make your own changes (that copy
; wins and survives updates).
;
; Mouse buttons and the wheel (mouse1..mouse5, mwheelup, mwheeldown) count
; only while Mouse aim is on in the F1 menu; the mouse then turns the player.
; The mouse turns off in the Xbox Live menus and matches (controller only there).
;
; Key names: letters and digits, space, tab, enter, backspace, shift, ctrl,
; alt, up, down, left, right, f1-f12, numpad0-numpad9, mouse1-mouse5,
; mwheelup, mwheeldown.

[keys]
; movement and look
left_stick_up    = W
left_stick_down  = S
left_stick_left  = A
left_stick_right = D
right_stick_up    = I
right_stick_down  = K
right_stick_left  = J
right_stick_right = L

; A jump, B melee, X reload / action, Y switch weapon
a = space, Z
b = F, X, mouse3
x = E, R, C
y = tab, V, mwheelup, mwheeldown

; right trigger fire, left trigger grenade
right_trigger = mouse1, 3
left_trigger  = G, 1, mouse4

; left stick click crouch, right stick click zoom
left_thumb  = ctrl, shift
right_thumb = mouse2, B

white = Q
black = 4, mouse5

start = enter
back  = backspace
dpad_up    = up
dpad_down  = down
dpad_left  = left
dpad_right = right
